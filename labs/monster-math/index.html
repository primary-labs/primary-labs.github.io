<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Static page: scripts and styles come only from this site, and connect-src 'none' means no
       script can send data anywhere. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Monster Math | Primary Labs</title>
  <meta name="description" content="Kindergarten adding and subtracting within 10. Count monsters or robots, cross some out, and pick the answer. Aligned to NYS Next Generation Math NY-K.OA.2a and NY-K.CC.4.">
  <meta name="theme-color" content="#FFF8EC">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="../../assets/fonts/andika-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../assets/primary-labs.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#math">Skip to the activity</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../../" aria-label="Primary Labs home">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><rect width="48" height="48" rx="13" fill="#1F2A44"/><path d="M18.5 10 H29.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/><path d="M21 11 V20 L13 33.5 Q11 38 16 38 H32 Q37 38 35 33.5 L27 20 V11" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/><path d="M16.6 29 H31.4 L33.6 33 Q34.6 35.5 31.8 35.5 H16.2 Q13.4 35.5 14.4 33 Z" fill="#FFC93C"/><circle cx="21" cy="24.5" r="2.2" fill="#E4572E"/><circle cx="27" cy="22" r="1.7" fill="#5AA9FF"/></svg>
        <span class="brand-name">Primary Labs</span>
      </a>
      <h1 class="lab-title">Monster Math</h1>
      <div class="tools">
        <span class="stars" id="stars" role="status" aria-label="0 stars">⭐ 0</span>
        <button type="button" class="icon-btn" id="sfx" aria-pressed="true" aria-label="Sound effects"></button>
      </div>
    </div>
  </header>

  <main class="wrap" id="main">
    <section class="panel math" id="math" tabindex="-1" aria-label="Math">
      <div class="settings">
        <div class="row"><span class="label" id="op-label">Do</span>
          <div class="segmented" id="opSeg" role="group" aria-labelledby="op-label">
            <button type="button" data-op="+" aria-pressed="true"><span class="sym" aria-hidden="true">+</span> Add</button>
            <button type="button" data-op="-" aria-pressed="false"><span class="sym" aria-hidden="true">−</span> Minus</button>
          </div>
        </div>
        <div class="row"><span class="label" id="kind-label">Friends</span>
          <div class="segmented" id="kindSeg" role="group" aria-labelledby="kind-label">
            <button type="button" data-kind="monster" aria-pressed="true">👾 Monsters</button>
            <button type="button" data-kind="robot" aria-pressed="false">🤖 Robots</button>
          </div>
        </div>
        <div class="row"><span class="label" id="max-label">Numbers</span>
          <div class="segmented" id="maxSeg" role="group" aria-labelledby="max-label">
            <button type="button" data-max="5" aria-pressed="true">up to 5</button>
            <button type="button" data-max="10" aria-pressed="false">up to 10</button>
          </div>
        </div>
      </div>

      <div class="problem" id="problem"></div>
      <p class="instruction" id="instr" aria-live="polite"></p>
      <div class="stage" id="stage"></div>
      <div class="answers" id="answers" role="group" aria-label="Answers"></div>
      <p class="hint" id="hint"></p>
      <div class="row center" id="cheerRow" hidden>
        <p class="cheer" id="cheer" role="status">Great job!</p>
      </div>
      <div class="row center" id="nextRow" hidden>
        <button type="button" class="btn btn--primary btn--big" id="next">Next one ➜</button>
      </div>
    </section>
  </main>

  <script src="js/phrases.js"></script>
  <script src="js/problems.js"></script>
  <script src="js/sound.js"></script>
  <script src="assets/audio/index.js"></script>
  <script src="js/art.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
